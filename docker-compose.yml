version: '3.8'

services:
  # 1. CyberNexus Full-Stack Web App (Express API + React Client SPA)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cybernexus-app:latest
    container_name: cybernexus-web
    restart: always
    ports:
      - "depend on your local host"
    environment:
      - NODE_ENV=production
      - PORT=number
      - MONGODB_URI=mongodb://mongodb:port/projectname
      - REDIS_URL=redis://redis:port
      - SESSION_SECRET=cyber_nexus_docker_secret_key_
    depends_on:
      - mongodb
      - redis

  # 2. Persistent MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: cybernexus-mongodb
    restart: always
    ports:
      - "port:port"
    volumes:
      - mongodb_data:/data/db

  # 3. Persistent Redis Caching Server
  redis:
    image: redis:7.0-alpine
    container_name: cybernexus-redis
    restart: always
    ports:
      - "port:port"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
