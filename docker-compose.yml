services:
  # 1. CyberNexus Full-Stack Web App
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cybernexus-app:latest
    container_name: cybernexus-web
    restart: always
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/cybernexus
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - mongodb
      - redis

  # 2. Persistent MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: cybernexus-mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db

  # 3. Persistent Redis Caching Server
  redis:
    image: redis:7.0-alpine
    container_name: cybernexus-redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
